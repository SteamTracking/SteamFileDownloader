name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish SteamFileDownloader.csproj -c Release -r win-x64 -o publish

      - uses: actions/upload-artifact@v7
        with:
          name: SteamFileDownloader
          path: publish/SteamFileDownloader.exe
